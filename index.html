<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Station House Studio — Content Production</title>
<style>
  :root{
    --bg:#0c0c0e; --panel:#141417; --panel2:#1b1b1f; --line:#2a2a30;
    --gold:#e0a63c; --gold2:#f0c56b; --red:#d33227; --ink:#f4efe6; --mut:#8a8a92;
    --ok:#4caf7d; --warn:#e0a63c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  .cond{font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-stretch:condensed}
  .up{text-transform:uppercase;letter-spacing:.14em}
  /* top bar */
  header.top{
    display:flex;align-items:center;gap:18px;padding:16px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#141417,#0e0e10);
  }
  .logo{font-weight:800;font-size:26px;letter-spacing:.02em}
  .logo .a{color:var(--gold)} .logo .b{color:var(--ink)}
  .redline{height:3px;width:60px;background:var(--red);border-radius:2px}
  .tagline{margin-left:auto;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
  /* layout */
  .body{display:flex;flex:1;min-height:0}
  nav.side{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:18px 0;overflow-y:auto}
  .navitem{padding:14px 22px;cursor:pointer;border-left:3px solid transparent}
  .navitem:hover{background:#1a1a1e}
  .navitem.active{background:#191518;border-left-color:var(--red)}
  .navitem .t{font-weight:800;font-size:16px;letter-spacing:.03em;text-transform:uppercase}
  .navitem.active .t{color:var(--gold)}
  .navitem .s{font-size:11px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
  .verse{padding:20px 22px;color:#6a6a72;font-style:italic;font-size:12px;border-top:1px solid var(--line);margin-top:14px}
  main{flex:1;min-width:0;display:flex;overflow:hidden}
  .stage{flex:1;min-width:0;padding:26px;overflow:auto;display:flex;flex-direction:column}
  .controls{width:340px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);padding:22px;overflow-y:auto}
  /* shared */
  h2.sec{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:0 0 2px}
  .subtitle{color:var(--mut);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px}
  .label{font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin:18px 0 8px;font-weight:700}
  .drop{
    flex:1;min-height:280px;border:2px dashed #3a3a42;border-radius:10px;display:flex;align-items:center;justify-content:center;
    text-align:center;color:var(--mut);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:15px;padding:20px;cursor:pointer;
    transition:.15s;background:#101013;
  }
  .drop:hover,.drop.hot{border-color:var(--gold);color:var(--gold2);background:#131013}
  canvas{max-width:100%;border-radius:8px;display:block}
  .canvwrap{position:relative;display:inline-block;max-width:100%;margin:0 auto}
  .btn{
    display:inline-block;border:1px solid var(--line);background:#17171b;color:var(--ink);
    padding:10px 14px;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;cursor:pointer;transition:.12s;
  }
  .btn:hover{border-color:var(--gold)}
  .btn.gold{background:var(--gold);color:#211a08;border-color:var(--gold)}
  .btn.gold:hover{background:var(--gold2)}
  .btn.red{background:var(--red);color:#fff;border-color:var(--red)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:7px 10px;font-size:11px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg .btn{flex:1;min-width:70px;text-align:center}
  .seg .btn.on{background:var(--gold);color:#211a08;border-color:var(--gold)}
  input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:3px;background:#33333a;outline:none;margin:6px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid #0c0c0e}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid #0c0c0e}
  .slrow{margin-bottom:12px}
  .slrow .top{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
  .slrow .val{color:var(--gold2);font-weight:700}
  select,input[type=text],input[type=number],textarea{
    width:100%;background:#101013;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:9px 11px;font-size:13px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px}
  .file{font-size:12px;color:var(--mut)}
  .status{font-size:12px;margin-top:10px;min-height:16px}
  .status.ok{color:var(--ok)} .status.err{color:var(--red)} .status.info{color:var(--gold2)}
  .hint{font-size:11px;color:#6a6a72;margin-top:6px;line-height:1.5}
  .divider{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);cursor:ew-resize;z-index:5}
  .divider::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--gold);border:3px solid #0c0c0e}
  .tag{display:inline-block;background:#1e1a12;color:var(--gold2);border:1px solid #3a3220;border-radius:20px;padding:4px 10px;font-size:11px;margin:3px 4px 0 0}
  .capbox{background:#101013;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
  .capbox .txt{font-size:14px;line-height:1.55;white-space:pre-wrap}
  .capbox .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .banner{background:#1a160c;border:1px solid #3a3220;border-radius:8px;padding:12px 14px;color:var(--gold2);font-size:12px;line-height:1.5;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .muted{color:var(--mut)}
  .center{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;flex:1}
  video{max-width:100%;border-radius:8px}
  .pill{font-size:10px;padding:2px 8px;border-radius:20px;background:#241d10;color:var(--gold2);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:6px}
</style>
</head>
<body>
<header class="top">
  <div class="logo cond up"><span class="a">Station House</span> <span class="b">Studio</span></div>
  <div class="redline"></div>
  <div class="tagline">Content Production · Tampa, FL</div>
</header>
<div class="body">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   STATION HOUSE STUDIO — single-file content production tool
   Sections: Design · Photo Lab · Motion · Converter · AI Studio
   Pure vanilla JS + Canvas + Web APIs. No external dependencies.
   ============================================================ */

const BRAND = {
  gold:"#e0a63c", gold2:"#f0c56b", red:"#d33227", ink:"#f4efe6", dark:"#0c0c0e", panel:"#141417", mut:"#8a8a92",
  name:"STATION HOUSE", sub:"BARBECUE", city:"TAMPA, FL"
};

const SECTIONS = [
  {id:"design",  t:"Design",    s:"Posts & Graphics"},
  {id:"photo",   t:"Photo Lab", s:"Grade & Compare"},
  {id:"motion",  t:"Motion",    s:"Photo → Video"},
  {id:"convert", t:"Converter", s:"HEIC · MOV · MP4"},
  {id:"ai",      t:"AI Studio", s:"Captions & Clips"},
];

let current = "photo";

/* ---------- nav ---------- */
function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = SECTIONS.map(x=>`
    <div class="navitem ${x.id===current?'active':''}" data-id="${x.id}">
      <div class="t">${x.t}</div><div class="s">${x.s}</div>
    </div>`).join("") + `<div class="verse">"As Iron Sharpens Iron" — Prov. 27:17</div>`;
  nav.querySelectorAll(".navitem").forEach(el=>{
    el.onclick = ()=>{ current = el.dataset.id; renderNav(); renderMain(); };
  });
}

/* ---------- helpers ---------- */
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }
function download(dataURL, name){ const a=document.createElement("a"); a.href=dataURL; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function downloadBlob(blob, name){ const url=URL.createObjectURL(blob); download(url,name); setTimeout(()=>URL.revokeObjectURL(url),4000); }
function loadImageFromFile(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ resolve(img); };
    img.onerror = ()=> reject(new Error("decode-fail"));
    img.src = url;
  });
}
function stamp(){ const d=new Date(); return d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)+"-"+("0"+d.getHours()).slice(-2)+("0"+d.getMinutes()).slice(-2); }

/* ============================================================
   GRADING ENGINE (shared by Photo Lab, Motion, Design)
   ============================================================ */
function buildToneLUT(p){
  // p: {exposure,contrast,shadows,highlights}
  const lut = new Uint8ClampedArray(256);
  const C = (p.contrast/100)*128;
  const cf = (259*(C+255))/(255*(259-C));
  const expF = 1 + (p.exposure/100)*0.6;
  for(let i=0;i<256;i++){
    let x = i*expF;
    const sw = Math.max(0, 1 - x/128);            // shadow weight
    x += (p.shadows/100)*60*sw;
    const hw = Math.max(0, (x-128)/127);          // highlight weight
    x += (p.highlights/100)*60*hw;
    x = cf*(x-128)+128;
    lut[i] = x<0?0:x>255?255:x;
  }
  return lut;
}
function applyGrade(data, p){
  const lut = buildToneLUT(p);
  const temp = (p.temperature/100)*30;
  const satMul = 1 + p.saturation/100;
  const vib = p.vibrance/100;
  const d = data.data;
  for(let i=0;i<d.length;i+=4){
    let r=lut[d[i]], g=lut[d[i+1]], b=lut[d[i+2]];
    r+=temp; b-=temp;
    r=r<0?0:r>255?255:r; b=b<0?0:b>255?255:b;
    const gray = 0.299*r+0.587*g+0.114*b;
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    const curSat = mx===0?0:(mx-mn)/mx;
    const mul = satMul*(1 + vib*(1-curSat));
    r=gray+(r-gray)*mul; g=gray+(g-gray)*mul; b=gray+(b-gray)*mul;
    d[i]  = r<0?0:r>255?255:r;
    d[i+1]= g<0?0:g>255?255:g;
    d[i+2]= b<0?0:b>255?255:b;
  }
  return data;
}
const NEUTRAL = {exposure:0,contrast:0,shadows:0,highlights:0,temperature:0,saturation:0,vibrance:0};
const SH_GRADE = {exposure:8,contrast:24,shadows:20,highlights:-14,temperature:20,saturation:12,vibrance:28};

/* ============================================================
   PHOTO LAB
   ============================================================ */
const PL = {
  img:null, params:{...NEUTRAL}, mode:"after", split:0.5,
  origData:null, gradedData:null, pw:0, ph:0
};
const PL_SLIDERS = [
  ["exposure","Exposure"],["contrast","Contrast"],["shadows","Shadows"],["highlights","Highlights"],
  ["temperature","Temperature"],["saturation","Saturation"],["vibrance","Vibrance"]
];

function photoLab(){
  const stage = el(`<div class="stage"><h2 class="sec">Photo Lab</h2><div class="subtitle">Grade & Compare</div>
    <div id="pl-stage" style="flex:1;display:flex;flex-direction:column"></div></div>`);
  const controls = el(`<div class="controls"></div>`);

  // stage content
  const st = stage.querySelector("#pl-stage");
  if(!PL.img){
    const drop = el(`<div class="drop">Upload a photo to start grading — JPG, PNG, or HEIC</div>`);
    const inp = el(`<input type="file" accept="image/*,.heic,.heif" style="display:none">`);
    drop.onclick=()=>inp.click();
    drop.ondragover=e=>{e.preventDefault();drop.classList.add("hot")};
    drop.ondragleave=()=>drop.classList.remove("hot");
    drop.ondrop=e=>{e.preventDefault();drop.classList.remove("hot"); if(e.dataTransfer.files[0]) plLoad(e.dataTransfer.files[0]);};
    inp.onchange=e=>{ if(e.target.files[0]) plLoad(e.target.files[0]); };
    st.appendChild(drop); st.appendChild(inp);
  } else {
    const wrap = el(`<div class="canvwrap" id="pl-wrap"></div>`);
    st.appendChild(wrap);
    plRenderCanvas();
  }

  // controls
  controls.appendChild(el(`<div class="label">Photo (JPG / PNG / HEIC)</div>`));
  const chg = el(`<button class="btn sm ghost">Choose File</button>`);
  const inp2 = el(`<input type="file" accept="image/*,.heic,.heif" style="display:none">`);
  chg.onclick=()=>inp2.click();
  inp2.onchange=e=>{ if(e.target.files[0]) plLoad(e.target.files[0]); };
  const st2 = el(`<div class="status info" id="pl-status"></div>`);
  controls.appendChild(chg); controls.appendChild(inp2); controls.appendChild(st2);

  controls.appendChild(el(`<div class="label">Compare View</div>`));
  const modes=[["after","After Only"],["split","Split Slider"],["side","Side by Side"],["hold","Hold: Before"]];
  const seg = el(`<div class="seg"></div>`);
  modes.forEach(([id,lbl])=>{
    const b=el(`<button class="btn sm ${PL.mode===id?'on':''}">${lbl}</button>`);
    b.onclick=()=>{
      if(!PL.img){ setStatus("pl-status","Upload a photo first — then these views come alive.","info"); return; }
      PL.mode=id; photoRefreshControls(); plRenderCanvas();
    };
    seg.appendChild(b);
  });
  controls.appendChild(seg);
  if(PL.mode==="hold") controls.appendChild(el(`<div class="hint">Press & hold the image to peek the original.</div>`));

  controls.appendChild(el(`<div class="label">One-Click</div>`));
  const oc = el(`<div class="row"></div>`);
  const g = el(`<button class="btn gold sm">Station House Grade</button>`);
  g.onclick=()=>{ if(!PL.img) return setStatus("pl-status","Upload a photo first.","err"); PL.params={...SH_GRADE}; plRecompute(); photoRefreshControls(); };
  const r = el(`<button class="btn sm ghost">Reset</button>`);
  r.onclick=()=>{ PL.params={...NEUTRAL}; plRecompute(); photoRefreshControls(); };
  oc.appendChild(g); oc.appendChild(r); controls.appendChild(oc);

  controls.appendChild(el(`<div class="label">Manual</div>`));
  const sliders = el(`<div id="pl-sliders"></div>`);
  PL_SLIDERS.forEach(([k,lbl])=>{
    const row = el(`<div class="slrow"><div class="top"><span>${lbl}</span><span class="val">${PL.params[k]}</span></div></div>`);
    const s = el(`<input type="range" min="-100" max="100" value="${PL.params[k]}">`);
    s.oninput=e=>{ PL.params[k]=+e.target.value; row.querySelector(".val").textContent=e.target.value; plRecompute(); };
    row.appendChild(s); sliders.appendChild(row);
  });
  controls.appendChild(sliders);

  controls.appendChild(el(`<div class="label">Export</div>`));
  const dl = el(`<button class="btn gold" style="width:100%">Download Graded JPG (Full Res)</button>`);
  dl.onclick=plExport;
  controls.appendChild(dl);
  controls.appendChild(el(`<div class="hint">Full-resolution export applies your grade to the original pixels — the on-screen preview is downscaled for speed.</div>`));

  const main=document.getElementById("main");
  main.innerHTML=""; main.appendChild(stage); main.appendChild(controls);
}
function photoRefreshControls(){ /* re-render only controls area cheaply by re-rendering section */ photoLab(); }

async function plLoad(file){
  setStatus("pl-status","Loading…","info");
  try{
    const img = await loadImageFromFile(file);
    PL.img = img; PL.params={...NEUTRAL}; PL.mode="after"; PL.split=0.5;
    plPreparePreview();
    setStatus("pl-status","Loaded ✓","ok");
    photoLab();
  }catch(err){
    // HEIC in Chrome/Firefox typically can't decode natively.
    setStatus("pl-status","Couldn't decode this file. If it's a HEIC from iPhone, use the Converter tab first, or set iPhone → Settings → Camera → Formats → Most Compatible.","err");
  }
}
function plPreparePreview(){
  const max=1200;
  let w=PL.img.naturalWidth||PL.img.width, h=PL.img.naturalHeight||PL.img.height;
  const scale=Math.min(1, max/Math.max(w,h));
  PL.pw=Math.round(w*scale); PL.ph=Math.round(h*scale);
  const c=document.createElement("canvas"); c.width=PL.pw; c.height=PL.ph;
  const ctx=c.getContext("2d"); ctx.drawImage(PL.img,0,0,PL.pw,PL.ph);
  PL.origData=ctx.getImageData(0,0,PL.pw,PL.ph);
  plRecompute(true);
}
function plRecompute(skipRender){
  if(!PL.origData) return;
  const copy=new ImageData(new Uint8ClampedArray(PL.origData.data), PL.pw, PL.ph);
  PL.gradedData=applyGrade(copy, PL.params);
  if(!skipRender) plRenderCanvas();
}
function plRenderCanvas(){
  const wrap=document.getElementById("pl-wrap"); if(!wrap) return;
  wrap.innerHTML="";
  if(PL.mode==="side"){
    const box=el(`<div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap"></div>`);
    const c1=mkCanvas(PL.origData,"BEFORE"); const c2=mkCanvas(PL.gradedData,"AFTER");
    box.appendChild(c1); box.appendChild(c2); wrap.appendChild(box); return;
  }
  const c=document.createElement("canvas"); c.width=PL.pw; c.height=PL.ph;
  const ctx=c.getContext("2d");
  if(PL.mode==="after"){ ctx.putImageData(PL.gradedData,0,0); }
  else if(PL.mode==="hold"){ ctx.putImageData(PL.gradedData,0,0);
    c.onmousedown=()=>{ctx.putImageData(PL.origData,0,0)};
    c.onmouseup=c.onmouseleave=()=>{ctx.putImageData(PL.gradedData,0,0)};
    c.ontouchstart=e=>{e.preventDefault();ctx.putImageData(PL.origData,0,0)};
    c.ontouchend=()=>{ctx.putImageData(PL.gradedData,0,0)};
  }
  else if(PL.mode==="split"){
    ctx.putImageData(PL.gradedData,0,0);
    const sx=Math.round(PL.pw*PL.split);
    ctx.putImageData(PL.origData,0,0,0,0,sx,PL.ph);
  }
  wrap.appendChild(c);
  if(PL.mode==="split"){
    const div=el(`<div class="divider"></div>`);
    div.style.left=(PL.split*100)+"%";
    wrap.appendChild(div);
    let drag=false;
    const move=clientX=>{ const r=c.getBoundingClientRect(); let x=(clientX-r.left)/r.width; x=Math.max(0,Math.min(1,x)); PL.split=x; div.style.left=(x*100)+"%"; plRenderSplitOnly(ctx); };
    div.onmousedown=()=>drag=true;
    window.addEventListener("mousemove",e=>{if(drag)move(e.clientX)});
    window.addEventListener("mouseup",()=>drag=false);
    div.ontouchmove=e=>{move(e.touches[0].clientX)};
  }
}
function plRenderSplitOnly(ctx){ ctx.putImageData(PL.gradedData,0,0); const sx=Math.round(PL.pw*PL.split); ctx.putImageData(PL.origData,0,0,0,0,sx,PL.ph); }
function mkCanvas(data,label){
  const box=el(`<div style="text-align:center"></div>`);
  const c=document.createElement("canvas"); c.width=data.width;c.height=data.height;c.style.maxWidth="300px";
  c.getContext("2d").putImageData(data,0,0);
  box.appendChild(c); box.appendChild(el(`<div class="pill" style="margin-top:6px">${label}</div>`));
  return box;
}
function plExport(){
  if(!PL.img) return setStatus("pl-status","Upload a photo first.","err");
  setStatus("pl-status","Rendering full resolution…","info");
  setTimeout(()=>{
    const w=PL.img.naturalWidth||PL.img.width, h=PL.img.naturalHeight||PL.img.height;
    const c=document.createElement("canvas"); c.width=w;c.height=h;
    const ctx=c.getContext("2d"); ctx.drawImage(PL.img,0,0,w,h);
    const d=ctx.getImageData(0,0,w,h); applyGrade(d,PL.params); ctx.putImageData(d,0,0);
    c.toBlob(b=>{ downloadBlob(b, "stationhouse-graded-"+stamp()+".jpg"); setStatus("pl-status","Downloaded ✓","ok"); }, "image/jpeg", 0.92);
  },30);
}
function setStatus(id,msg,cls){ const e=document.getElementById(id); if(e){e.className="status "+(cls||"info"); e.textContent=msg;} }

/* ============================================================
   MOTION — photo → video (Ken Burns) with MediaRecorder export
   ============================================================ */
const MO = { img:null, aspect:"9:16", dur:6, motion:"zoomin", grade:false, rec:false };
const ASPECTS={"9:16":[720,1280],"1:1":[1080,1080],"4:5":[1080,1350],"16:9":[1280,720]};

function motion(){
  const stage=el(`<div class="stage"><h2 class="sec">Motion</h2><div class="subtitle">Photo → Video</div>
    <div id="mo-stage" style="flex:1;display:flex;flex-direction:column"></div></div>`);
  const controls=el(`<div class="controls"></div>`);
  const st=stage.querySelector("#mo-stage");
  if(!MO.img){
    const drop=el(`<div class="drop">Upload a photo to animate into a video clip</div>`);
    const inp=el(`<input type="file" accept="image/*" style="display:none">`);
    drop.onclick=()=>inp.click();
    inp.onchange=e=>{ if(e.target.files[0]) moLoad(e.target.files[0]); };
    st.appendChild(drop); st.appendChild(inp);
  }else{
    const [w,h]=ASPECTS[MO.aspect];
    st.appendChild(el(`<div class="canvwrap"><canvas id="mo-canvas" width="${w}" height="${h}" style="max-height:60vh"></canvas></div>`));
    st.appendChild(el(`<div class="status info" id="mo-status" style="margin-top:12px"></div>`));
  }
  controls.appendChild(el(`<div class="label">Source Photo</div>`));
  const chg=el(`<button class="btn sm ghost">Choose File</button>`); const inp2=el(`<input type="file" accept="image/*" style="display:none">`);
  chg.onclick=()=>inp2.click(); inp2.onchange=e=>{ if(e.target.files[0]) moLoad(e.target.files[0]); };
  controls.appendChild(chg); controls.appendChild(inp2);

  controls.appendChild(el(`<div class="label">Aspect Ratio</div>`));
  controls.appendChild(segChoice(Object.keys(ASPECTS).map(a=>[a,a]),MO.aspect,v=>{MO.aspect=v;motion();}));

  controls.appendChild(el(`<div class="label">Motion</div>`));
  controls.appendChild(segChoice([["zoomin","Zoom In"],["zoomout","Zoom Out"],["panlr","Pan L→R"],["panrl","Pan R→L"],["zoompan","Zoom + Pan"]],MO.motion,v=>{MO.motion=v;motion();}));

  controls.appendChild(el(`<div class="label">Duration — <span class="val" style="color:var(--gold2)">${MO.dur}s</span></div>`));
  const ds=el(`<input type="range" min="3" max="15" value="${MO.dur}">`);
  ds.oninput=e=>{MO.dur=+e.target.value; e.target.previousElementSibling; motion();};
  controls.appendChild(ds);

  const gl=el(`<label class="row" style="align-items:center;gap:8px;margin-top:14px;cursor:pointer"><input type="checkbox" ${MO.grade?"checked":""}><span class="file">Apply Station House Grade</span></label>`);
  gl.querySelector("input").onchange=e=>{MO.grade=e.target.checked;};
  controls.appendChild(gl);

  controls.appendChild(el(`<div class="label">Actions</div>`));
  const prev=el(`<button class="btn sm" style="width:100%;margin-bottom:8px">Preview Animation</button>`);
  prev.onclick=()=>{ if(!MO.img) return; moAnimate(null); };
  const exp=el(`<button class="btn gold" style="width:100%">Export Video</button>`);
  exp.onclick=moExport;
  controls.appendChild(prev); controls.appendChild(exp);
  controls.appendChild(el(`<div class="hint">Exports a real video via your browser's recorder (WebM, or MP4 where supported). Great for Reels, Stories & TikTok.</div>`));

  const main=document.getElementById("main"); main.innerHTML=""; main.appendChild(stage); main.appendChild(controls);
  if(MO.img) moDrawFrame(0);
}
async function moLoad(file){ try{ MO.img=await loadImageFromFile(file); motion(); }catch(e){ alert("Couldn't load image. Convert HEIC in the Converter tab first."); } }
function moCover(ctx,W,H,scale,panX,panY){
  const iw=MO.img.naturalWidth||MO.img.width, ih=MO.img.naturalHeight||MO.img.height;
  const base=Math.max(W/iw,H/ih); const s=base*scale;
  const dw=iw*s, dh=ih*s;
  const x=(W-dw)/2 + panX*(dw-W)*0.5*-1;
  const y=(H-dh)/2 + panY*(dh-H)*0.5*-1;
  ctx.drawImage(MO.img,x,y,dw,dh);
}
function moFrame(ctx,W,H,t){ // t 0..1
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
  let scale=1, panX=0, panY=0;
  const ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  if(MO.motion==="zoomin") scale=1.0+0.18*ease;
  else if(MO.motion==="zoomout") scale=1.18-0.18*ease;
  else if(MO.motion==="panlr"){ scale=1.12; panX=-1+2*ease; }
  else if(MO.motion==="panrl"){ scale=1.12; panX=1-2*ease; }
  else if(MO.motion==="zoompan"){ scale=1.0+0.16*ease; panX=-0.6+1.2*ease; }
  moCover(ctx,W,H,scale,panX,panY);
  if(MO.grade){ const d=ctx.getImageData(0,0,W,H); applyGrade(d,SH_GRADE); ctx.putImageData(d,0,0); }
}
function moDrawFrame(t){ const c=document.getElementById("mo-canvas"); if(!c)return; moFrame(c.getContext("2d"),c.width,c.height,t); }
function moAnimate(onFrame){
  const c=document.getElementById("mo-canvas"); if(!c)return;
  const ctx=c.getContext("2d"); const start=performance.now(); const dur=MO.dur*1000;
  return new Promise(res=>{
    function loop(now){ let t=(now-start)/dur; if(t>1)t=1; moFrame(ctx,c.width,c.height,t); if(onFrame)onFrame(); if(t<1) requestAnimationFrame(loop); else res(); }
    requestAnimationFrame(loop);
  });
}
async function moExport(){
  if(!MO.img) return;
  const c=document.getElementById("mo-canvas"); if(!c) return;
  const mime = MediaRecorder.isTypeSupported("video/mp4;codecs=avc1") ? "video/mp4;codecs=avc1"
             : MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
  const ext = mime.indexOf("mp4")>=0?"mp4":"webm";
  const stream=c.captureStream(30);
  const chunks=[]; const rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:8000000});
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  rec.onstop=()=>{ const blob=new Blob(chunks,{type:mime}); downloadBlob(blob,"stationhouse-motion-"+stamp()+"."+ext); setStatus("mo-status","Exported ✓ ("+ext.toUpperCase()+")","ok"); };
  setStatus("mo-status","Recording clip…","info");
  rec.start();
  await moAnimate(null);
  setTimeout(()=>rec.stop(),120);
}

/* ============================================================
   CONVERTER — HEIC/image → JPG/PNG, video re-encode
   ============================================================ */
const CV={ format:"image/jpeg", quality:0.9, maxdim:0 };
function converter(){
  const stage=el(`<div class="stage"><h2 class="sec">Converter</h2><div class="subtitle">HEIC · MOV · MP4</div>
    <div id="cv-log" style="flex:1"></div></div>`);
  const controls=el(`<div class="controls"></div>`);

  controls.appendChild(el(`<div class="label">Images → JPG / PNG</div>`));
  const imgInp=el(`<input type="file" accept="image/*,.heic,.heif" multiple style="display:none">`);
  const imgBtn=el(`<button class="btn gold sm" style="width:100%">Choose Image(s)</button>`);
  imgBtn.onclick=()=>imgInp.click(); imgInp.onchange=e=>cvImages([...e.target.files]);
  controls.appendChild(imgBtn); controls.appendChild(imgInp);

  controls.appendChild(el(`<div class="label">Output Format</div>`));
  controls.appendChild(segChoice([["image/jpeg","JPG"],["image/png","PNG"],["image/webp","WEBP"]],CV.format,v=>{CV.format=v;converter();}));

  if(CV.format!=="image/png"){
    controls.appendChild(el(`<div class="label">Quality — <span class="val" style="color:var(--gold2)">${Math.round(CV.quality*100)}%</span></div>`));
    const q=el(`<input type="range" min="40" max="100" value="${Math.round(CV.quality*100)}">`);
    q.oninput=e=>{CV.quality=+e.target.value/100; e.target.parentElement; };
    q.onchange=()=>converter();
    controls.appendChild(q);
  }
  controls.appendChild(el(`<div class="label">Max Dimension (px, 0 = keep)</div>`));
  const md=el(`<input type="number" min="0" value="${CV.maxdim}">`); md.onchange=e=>CV.maxdim=+e.target.value||0;
  controls.appendChild(md);

  controls.appendChild(el(`<div class="label">Video Re-encode</div>`));
  const vInp=el(`<input type="file" accept="video/*" style="display:none">`);
  const vBtn=el(`<button class="btn sm ghost" style="width:100%">Choose Video (MOV / MP4 / WEBM)</button>`);
  vBtn.onclick=()=>vInp.click(); vInp.onchange=e=>{ if(e.target.files[0]) cvVideo(e.target.files[0]); };
  controls.appendChild(vBtn); controls.appendChild(vInp);
  controls.appendChild(el(`<div class="hint">Video re-encoding runs in-browser by re-recording playback to your browser's supported codec (WebM/MP4). It's an approximation — best for short clips; audio is included where the browser allows.</div>`));

  const log=stage.querySelector("#cv-log");
  log.appendChild(el(`<div class="banner">Drop iPhone HEIC photos here and get web-ready JPGs instantly. Pro tip baked into the workflow: iPhone → Settings → Camera → Formats → <b>Most Compatible</b> makes every future photo a JPG automatically.</div>`));
  log.appendChild(el(`<div id="cv-results"></div>`));

  const main=document.getElementById("main"); main.innerHTML=""; main.appendChild(stage); main.appendChild(controls);
}
async function cvImages(files){
  const res=document.getElementById("cv-results");
  for(const f of files){
    const row=el(`<div class="capbox"><div class="txt">${f.name}</div><div class="meta"><span class="file" id="s-${cvId()}">Converting…</span></div></div>`);
    const sid=row.querySelector(".file").id;
    res.prepend(row);
    try{
      const img=await loadImageFromFile(f);
      let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      if(CV.maxdim>0){ const s=Math.min(1,CV.maxdim/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s); }
      const c=document.createElement("canvas"); c.width=w;c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      const ext=CV.format==="image/png"?"png":CV.format==="image/webp"?"webp":"jpg";
      c.toBlob(b=>{
        const s=document.getElementById(sid); s.className="file";
        const dln=f.name.replace(/\.[^.]+$/,"")+"."+ext;
        const btn=el(`<button class="btn sm gold">Download ${ext.toUpperCase()}</button>`);
        btn.onclick=()=>downloadBlob(b,dln);
        s.textContent=(b.size/1024).toFixed(0)+" KB · "+w+"×"+h+"  ";
        s.parentElement.appendChild(btn);
      },CV.format,CV.quality);
    }catch(err){
      const s=document.getElementById(sid); s.className="file"; s.style.color="var(--red)";
      s.textContent="Couldn't decode (browser can't read this HEIC). Try Safari, or set iPhone to Most Compatible.";
    }
  }
}
let _cvid=0; function cvId(){ return ++_cvid; }
async function cvVideo(file){
  const res=document.getElementById("cv-results");
  const row=el(`<div class="capbox"><div class="txt">${file.name}</div><div class="meta"><span class="file">Re-encoding…</span></div></div>`);
  res.prepend(row); const status=row.querySelector(".file");
  const video=document.createElement("video"); video.muted=false; video.src=URL.createObjectURL(file); video.playsInline=true;
  await new Promise(r=>{video.onloadedmetadata=r;});
  const W=video.videoWidth, H=video.videoHeight;
  const c=document.createElement("canvas"); c.width=W;c.height=H; const ctx=c.getContext("2d");
  const mime=MediaRecorder.isTypeSupported("video/mp4;codecs=avc1")?"video/mp4;codecs=avc1":"video/webm;codecs=vp9";
  const ext=mime.indexOf("mp4")>=0?"mp4":"webm";
  const vstream=c.captureStream(30); const chunks=[];
  const rec=new MediaRecorder(vstream,{mimeType:mime,videoBitsPerSecond:8000000});
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{ const blob=new Blob(chunks,{type:mime}); status.textContent="Done · "+(blob.size/1048576).toFixed(1)+" MB  ";
    const btn=el(`<button class="btn sm gold">Download ${ext.toUpperCase()}</button>`); btn.onclick=()=>downloadBlob(blob,file.name.replace(/\.[^.]+$/,"")+"-reencoded."+ext); status.parentElement.appendChild(btn); };
  rec.start();
  video.play();
  function draw(){ if(video.paused||video.ended){ setTimeout(()=>rec.stop(),120); return;} ctx.drawImage(video,0,0,W,H); requestAnimationFrame(draw); }
  draw();
  video.onended=()=>{ setTimeout(()=>rec.stop(),120); };
}

/* ============================================================
   DESIGN — brand graphics generator
   ============================================================ */
const DS={ template:"quote", ratio:"1:1", headline:"Low & slow since day one.", sub:"Brisket smoked 14 hours over oak.", tagline:"STATION HOUSE BBQ · TAMPA, FL", bg:null };
const DRATIOS={"1:1":[1080,1080],"4:5":[1080,1350],"9:16":[1080,1920]};
function design(){
  const stage=el(`<div class="stage"><h2 class="sec">Design</h2><div class="subtitle">Posts & Graphics</div>
    <div class="canvwrap" style="margin-top:6px"><canvas id="ds-canvas" style="max-height:64vh"></canvas></div></div>`);
  const controls=el(`<div class="controls"></div>`);
  controls.appendChild(el(`<div class="label">Template</div>`));
  controls.appendChild(segChoice([["quote","Quote"],["promo","Promo"],["menu","Menu Item"],["event","Event"]],DS.template,v=>{DS.template=v;design();}));
  controls.appendChild(el(`<div class="label">Aspect</div>`));
  controls.appendChild(segChoice(Object.keys(DRATIOS).map(r=>[r,r]),DS.ratio,v=>{DS.ratio=v;design();}));

  controls.appendChild(el(`<div class="label">Headline</div>`));
  const h=el(`<textarea>${DS.headline}</textarea>`); h.oninput=e=>{DS.headline=e.target.value;dsDraw();}; controls.appendChild(h);
  controls.appendChild(el(`<div class="label">${DS.template==="menu"?"Price / Detail":DS.template==="event"?"Date / Detail":"Subtext"}</div>`));
  const s=el(`<textarea>${DS.sub}</textarea>`); s.oninput=e=>{DS.sub=e.target.value;dsDraw();}; controls.appendChild(s);
  controls.appendChild(el(`<div class="label">Footer / Tagline</div>`));
  const tg=el(`<input type="text" value="${DS.tagline}">`); tg.oninput=e=>{DS.tagline=e.target.value;dsDraw();}; controls.appendChild(tg);

  controls.appendChild(el(`<div class="label">Background Photo (optional)</div>`));
  const bi=el(`<input type="file" accept="image/*" style="display:none">`); const bb=el(`<button class="btn sm ghost">Choose Photo</button>`);
  bb.onclick=()=>bi.click(); bi.onchange=async e=>{ if(e.target.files[0]){ try{DS.bg=await loadImageFromFile(e.target.files[0]); dsDraw();}catch(x){} } };
  const bc=el(`<button class="btn sm ghost" style="margin-left:6px">Clear</button>`); bc.onclick=()=>{DS.bg=null;dsDraw();};
  const brow=el(`<div class="row"></div>`); brow.appendChild(bb); brow.appendChild(bc); brow.appendChild(bi); controls.appendChild(brow);

  controls.appendChild(el(`<div class="label">Export</div>`));
  const dl=el(`<button class="btn gold" style="width:100%">Download PNG</button>`); dl.onclick=()=>{ const c=document.getElementById("ds-canvas"); c.toBlob(b=>downloadBlob(b,"stationhouse-"+DS.template+"-"+stamp()+".png"),"image/png"); };
  controls.appendChild(dl);

  const main=document.getElementById("main"); main.innerHTML=""; main.appendChild(stage); main.appendChild(controls);
  dsDraw();
}
function wrapText(ctx,text,x,y,maxW,lh){ const words=text.split(/\s+/); let line=""; const lines=[];
  for(const w of words){ const test=line?line+" "+w:w; if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=w;} else line=test; }
  if(line)lines.push(line);
  lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lh)); return lines.length*lh;
}
function dsDraw(){
  const c=document.getElementById("ds-canvas"); if(!c)return; const [W,H]=DRATIOS[DS.ratio]; c.width=W;c.height=H; const ctx=c.getContext("2d");
  ctx.fillStyle=BRAND.dark; ctx.fillRect(0,0,W,H);
  if(DS.bg){ const iw=DS.bg.naturalWidth,ih=DS.bg.naturalHeight; const s=Math.max(W/iw,H/ih); const dw=iw*s,dh=ih*s; ctx.drawImage(DS.bg,(W-dw)/2,(H-dh)/2,dw,dh);
    const d=ctx.getImageData(0,0,W,H); applyGrade(d,SH_GRADE); ctx.putImageData(d,0,0);
    ctx.fillStyle="rgba(8,8,10,0.55)"; ctx.fillRect(0,0,W,H);
  }
  // border frame
  ctx.strokeStyle=BRAND.gold; ctx.lineWidth=W*0.012; ctx.strokeRect(W*0.05,H*0.05,W*0.9,H*0.9);
  // red rule
  ctx.fillStyle=BRAND.red; ctx.fillRect(W*0.1,H*0.16,W*0.16,H*0.01);
  // brand mark
  ctx.textAlign="left"; ctx.fillStyle=BRAND.gold; ctx.font="800 "+(W*0.045)+"px 'Arial Narrow',Arial,sans-serif";
  ctx.fillText("STATION HOUSE", W*0.1, H*0.135);

  const label = DS.template==="promo"?"SPECIAL":DS.template==="menu"?"ON THE MENU":DS.template==="event"?"EVENT":"";
  if(label){ ctx.fillStyle=BRAND.gold2; ctx.font="700 "+(W*0.026)+"px Arial"; ctx.fillText(label, W*0.1, H*0.30); }

  // headline
  ctx.fillStyle=BRAND.ink; ctx.font="800 "+(W*0.072)+"px 'Arial Narrow',Arial,sans-serif";
  const hEnd=wrapText(ctx,DS.headline.toUpperCase(),W*0.1,H*0.40,W*0.8,W*0.082);
  // subtext / price
  if(DS.template==="menu"||DS.template==="promo"){ ctx.fillStyle=BRAND.gold; ctx.font="800 "+(W*0.06)+"px 'Arial Narrow',Arial,sans-serif"; }
  else { ctx.fillStyle=BRAND.mut; ctx.font="400 "+(W*0.036)+"px Arial"; }
  wrapText(ctx,DS.sub,W*0.1,H*0.42+hEnd,W*0.8,W*0.05);

  // footer
  ctx.fillStyle=BRAND.gold; ctx.font="700 "+(W*0.026)+"px Arial"; ctx.textAlign="left";
  ctx.fillText(DS.tagline, W*0.1, H*0.9);
}

/* ---------- generic segmented control ---------- */
